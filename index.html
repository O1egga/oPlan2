<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oPlan2</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="pluginJsCss/beer.scoped.min.css">

  <script src="pluginJsCss/go-debug.js"></script>
  <script type="module" src="pluginJsCss/beer.min.js"></script>
</head>

<body>
  <div id="myDiagramDiv"></div>

  <div class="beer">


    <dialog id="equipmentDialog" class="right active">


      <h5>Добавить оборудование</h5>

      <div class="large-space"></div>

      <!-- тип -->
      <div class="row">
        <div class="max">
          <div class="field border label">
            <select>
              <option>РРЛ</option>
              <option>BTS</option>
              <option>WiFi</option>
            </select>
            <label>Тип</label>
          </div>
        </div>

        <!-- название -->
        <div class="max">
          <div class="field border label">
            <input>
            <label>Название</label>
          </div>
        </div>
      </div>

      <!-- производитель -->
      <div class="row">
        <div class="max">
          <div class="field border label">
            <select>
              <option>Nec</option>
              <option>Huawei</option>
              <option>Ubiquiti</option>
            </select>
            <label>Производитель</label>
          </div>
        </div>

        <!-- модель -->
        <div class="max">
          <div class="field border label">
            <select>
              <option>iPassolink400</option>
              <option>3606C</option>
              <option>PB-M5-500</option>
            </select>
            <label>Модель</label>
          </div>
        </div>
      </div>

      <!-- порты -->
      <ul class="list no-space ports">
      </ul>

      <hr class="medium">

      <div class="row">
        <div class="field small border">
          <select class="port-count">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
          </select>
        </div>

        <div class="field small border label">
          <select class="port-type">
            <option value="1">Radio</option>
            <option value="2">Coaxial</option>
            <option value="3">Cross</option>
            <option value="4">Ethernet</option>
            <option value="5">Optical</option>
            <option value="6">SFP-Eth</option>
            <option value="7">SFP-Opt</option>
            <option value="10">Other</option>
          </select>
          <label>тип</label>
        </div>

        <div class="max"></div>

        <!-- добавить порты -->
        <nav class="group connected">

          <button class="left-round square add-ports">
            <i>add</i>
            <span class="tooltip">Добавить порты</span>
          </button>

          <!-- удалить все порты -->
          <button class="square delete-all-ports">
            <i>delete</i>
            <span class="tooltip">Удалить все порты</span>

            <!-- удалить порты -->
            <button class="right-round square delete-ports">
              <i>remove</i>
              <span class="tooltip">Удалить порты</span>
            </button>
        </nav>

      </div>

      <div class="large-space"></div>

      <!-- созранить/отменаа -->
      <nav>
        <button>Сохранить</button>
        <button class="border">Отмена</button>
      </nav>

    </dialog>

  </div>

  <script type="module" src="main.js"></script>
</body>

</html>

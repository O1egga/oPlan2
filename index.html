<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oPlan2</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="pluginJsCss/beer.scoped.min.css">

  <script src="pluginJsCss/go-debug.js"></script>
  <script type="module" src="pluginJsCss/beer.min.js"></script>
</head>

<body>
  <div id="myDiagramDiv"></div>

  <div class="beer">


    <dialog id="equipmentDialog" class="right active">


      <h5>Добавить оборудование</h5>

      <div class="large-space"></div>

      <!-- тип -->
      <div class="row">
        <div class="max">
          <div class="field border label">
            <select>
              <option>РРЛ</option>
              <option>BTS</option>
              <option>WiFi</option>
            </select>
            <label>Тип</label>
          </div>
        </div>

        <!-- название -->
        <div class="max">
          <div class="field border label">
            <input>
            <label>Название</label>
          </div>
        </div>
      </div>

      <!-- производитель -->
      <div class="row">
        <div class="max">
          <div class="field border label">
            <select>
              <option>Nec</option>
              <option>Huawei</option>
              <option>Ubiquiti</option>
            </select>
            <label>Производитель</label>
          </div>
        </div>

        <!-- модель -->
        <div class="max">
          <div class="field border label">
            <select>
              <option>iPassolink400</option>
              <option>3606C</option>
              <option>PB-M5-500</option>
            </select>
            <label>Модель</label>
          </div>
        </div>
      </div>


      <!-- место для слотов -->





      <!-- добавить слот -->
      <div class="row">
        <div class="max"></div>
        <button id="addSlot" class="fill">добавить слот</button>
      </div>

      <div class="large-space"></div>

      <!-- созранить/отменаа -->
      <nav>
        <button>Сохранить</button>
        <button class="border">Отмена</button>
      </nav>

    </dialog>

  </div>

  <script type="module" src="main.js"></script>
</body>

</html>

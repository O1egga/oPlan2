<dialog id="confirmDialog">
  <h5 class="confirm-title"></h5>
  <p class="confirm-message"></p>

  <div id="confirmInputField" class="field border" hidden>
    <input id="confirmInput" type="text">
  </div>

  <nav>
    <button class="error confirm-ok">
      <i>delete</i>
      <span class="confirm-ok-text">Удалить</span>
    </button>

    <button class="border confirm-cancel">Отмена</button>
  </nav>
</dialog>

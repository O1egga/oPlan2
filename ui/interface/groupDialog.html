<dialog id="groupDialog" class="right">

  <h5>Добавить группу</h5>

  <div class="large-space"></div>

  <!-- тип группы -->
  <div class="field border label">
    <select class="group-type"></select>
    <label>Тип</label>
  </div>

  <!-- название -->
  <div class="field border label">
    <input class="group-name">
    <label>Название</label>
  </div>

  <!-- родитель -->
  <div class="field border label">
    <input class="group-parent" disabled>
    <label>Родитель</label>
  </div>


  <!-- кнопки -->
  <nav>
    <button class="save-group" disabled>
      Сохранить
    </button>

    <button class="border cancel-group">
      Отмена
    </button>
  </nav>

</dialog>
